basePath: /
definitions:
  handler.HealthResponse:
    properties:
      db:
        example: ok
        type: string
      request_id:
        example: req-123
        type: string
      status:
        example: ok
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Backend API for the Lotto Journal LINE Bot and verification engine.
  title: Lotto Journal API
  version: "0.2"
paths:
  /health:
    get:
      description: Checks if the API server is live and the database connection is
        healthy.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Perform health check
      tags:
      - System
  /jobs/sync-schedule:
    post:
      description: Syncs the lottery draw dates from the GLO API for the current year.
        Secured with CRON_SECRET.
      parameters:
      - description: Bearer <token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Draw schedule sync complete
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Sync draw schedule
      tags:
      - Jobs
  /jobs/verify-results:
    post:
      description: Fetches the latest lottery results from GLO API and processes unchecked
        user tickets. Secured with CRON_SECRET.
      parameters:
      - description: Bearer <token>
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Result check trigger complete
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify lottery results
      tags:
      - Jobs
  /webhook:
    post:
      consumes:
      - application/json
      description: Handles incoming LINE Messaging API events (follow, unfollow, message).
      parameters:
      - description: Signature header for LINE payload validation
        in: header
        name: X-Line-Signature
        required: true
        type: string
      - description: LINE Event Payload
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid signature or request payload
        "500":
          description: Internal Server Error
      summary: LINE Webhook Receiver
      tags:
      - LINE
swagger: "2.0"
